name: Lastro verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.10
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-admin-fixture-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_URL: http://127.0.0.1:5083
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: lastro_test
      DB_USERNAME: lastro_test
      DB_PASSWORD: ci-app-fixture-only
      DB_SSLMODE: disable
      SESSION_DRIVER: database
      CACHE_STORE: database
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0
          cache: npm
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: 8.5.11
          extensions: pdo_pgsql, pgsql, mbstring, intl, zip, dom, fileinfo
          tools: composer:2.10.3
          coverage: none
      - name: Create the isolated database with a non-superuser application role
        env:
          PGPASSWORD: ci-admin-fixture-only
        run: |
          psql --host=127.0.0.1 --username=postgres --dbname=postgres --set=ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE lastro_test LOGIN PASSWORD 'ci-app-fixture-only' NOSUPERUSER NOCREATEDB NOCREATEROLE;
          CREATE DATABASE lastro_test OWNER lastro_test;
          REVOKE CONNECT ON DATABASE postgres FROM PUBLIC;
          SQL
      - run: cp .env.example .env
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer validate --strict
      - run: composer check-platform-reqs
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
      - run: php vendor/bin/pint --test --format agent
      - run: php artisan test --compact
      - name: Prepare the browser test database explicitly
        run: |
          php artisan migrate --force --no-interaction
          php artisan cache:clear --no-interaction
      - run: npm run test:e2e
      - run: git diff --check
